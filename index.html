<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBreadboard - Hello World</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #00675b; }
        #output { font-weight: bold; color: #333; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>OpenBreadboard</h1>
        <p>Status: WebAssembly Engine Loading...</p>
        <!-- This is the target element our C++ code will look for -->
        <div id="output">Waiting for C++ engine...</div>
    </div>

    <!-- Emscripten will automatically generate this hello.js glue code for us -->
    <script src="hello.js"></script>

</body>
</html>
